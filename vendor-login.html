<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login | Primax Global, Inc.</title>
    <meta name="description" content="Vendor Portal Login for Primax Global, Inc.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: #f5f7fa;
            color: #1f2933;
        }

        header {
            background: #102a43;
            color: white;
        }

        .nav {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .page {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #102a43;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #52606d;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #102a43;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #102a43;
            box-shadow: 0 0 0 2px rgba(16,42,67,0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #102a43;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #243b53;
        }

        button:disabled {
            background: #9aa5b1;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
            line-height: 1.6;
        }

        .success {
            display: block;
            background: #e8f5e9;
            color: #256029;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #a61b1b;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #52606d;
            line-height: 1.5;
        }

        .register-link a {
            color: #102a43;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .required {
            color: #c0392b;
        }

        footer {
            background: #0b1f33;
            color: #bcccdc;
            text-align: center;
            padding: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .nav {
                flex-direction: column;
            }

            .nav-links {
                margin-top: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav a {
                margin: 5px 8px;
            }

            .login-box {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="nav">
        <div class="logo">
            Primax Global, Inc.
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#government">Government</a>
            <a href="products.html">Products</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </div>
    </div>
</header>

<main class="page">
    <div class="login-box">
        <h1>Vendor Login</h1>
        <p class="subtitle">
            Access your Primax Global, Inc. vendor account
        </p>

        <form id="loginForm">
            <label for="email">
                Email Address <span class="required">*</span>
            </label>
            <input type="email" id="email" required autocomplete="email" placeholder="company@example.com">

            <label for="password">
                Password <span class="required">*</span>
            </label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <div id="message" class="message"></div>
        </form>

        <div class="register-link">
            Don't have a vendor account? <a href="vendor-regist.htm">Register Here</a>
        </div>
    </div>
</main>

<footer>
    Primax Global, Inc.<br>
    3660 Wilshire Blvd, Suite 512, Los Angeles, CA 90010<br>
    © 2026 Primax Global, Inc. All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */
const SUPABASE_URL = "https://nhjapidacizvhebtpzah.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCblAx3NmcI7V8dR-_VL_w_vFmvfdhV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

/* =========================================================
   DOM ELEMENTS
========================================================= */
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

/* =========================================================
   UI HELPER
========================================================= */
function showMessage(text, type) {
    message.className = "message " + type;
    message.textContent = text;
}

/* =========================================================
   CHECK EXISTING SESSION ON PAGE LOAD
========================================================= */
async function checkActiveSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        // 이미 로그인된 상태면 대시보드로 이동
        window.location.href = "vendor-dashboard.html";
    }
}
checkActiveSession();

/* =========================================================
   LOGIN LOGIC
========================================================= */
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    button.disabled = true;
    button.textContent = "Signing In...";

    try {
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            throw new Error("Please enter both email and password.");
        }

        // Supabase Auth SignIn
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        if (!data || !data.user) {
            throw new Error("Login failed. Please try again.");
        }

        // 로그인 성공 UI
        showMessage("Login successful! Redirecting to your dashboard...", "success");

        // 대시보드로 리다이렉트
        setTimeout(() => {
            window.location.href = "vendor-dashboard.html";
        }, 1000);

    } catch (error) {
        console.error("Vendor login error:", error);

        let errorMessage = "Invalid email or password. Please try again.";

        if (error.message && error.message.toLowerCase().includes("email not confirmed")) {
            errorMessage = "Please confirm your email address before logging in. Check your inbox for the confirmation link.";
        } else if (error.message && error.message.toLowerCase().includes("invalid login credentials")) {
            errorMessage = "Incorrect email or password. Please check your credentials.";
        } else if (error.message) {
            errorMessage = error.message;
        }

        showMessage(errorMessage, "error");

        button.disabled = false;
        button.textContent = "Sign In";
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | Primax Global, Inc.</title>
    <meta name="description" content="Vendor Dashboard for Primax Global, Inc.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", "Malgun Gothic", sans-serif;
            background: #f5f7fa;
            color: #1f2933;
        }

        header {
            background: #102a43;
            color: white;
        }

        .nav {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav a, .nav button.btn-logout-link {
            color: white;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .nav a:hover, .nav button.btn-logout-link:hover {
            text-decoration: underline;
        }

        .page {
            min-height: calc(100vh - 150px);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .dashboard-card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e4e7eb;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: #102a43;
            font-size: 28px;
        }

        .welcome-text {
            color: #52606d;
            font-size: 15px;
            margin-top: 5px;
        }

        .btn-logout {
            background: #cbd5e1;
            color: #102a43;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: #bcccdc;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #102a43;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #102a43;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        input:focus:not([readonly]), select:focus {
            outline: none;
            border-color: #102a43;
            box-shadow: 0 0 0 2px rgba(16,42,67,0.1);
        }

        .btn-save {
            background: #102a43;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-save:hover {
            background: #243b53;
        }

        .btn-save:disabled {
            background: #9aa5b1;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
            line-height: 1.6;
        }

        .success {
            display: block;
            background: #e8f5e9;
            color: #256029;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #a61b1b;
        }

        /* Loading Spinner Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #102a43;
            z-index: 9999;
        }

        footer {
            background: #0b1f33;
            color: #bcccdc;
            text-align: center;
            padding: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .nav {
                flex-direction: column;
            }

            .nav-links {
                margin-top: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav a, .nav button.btn-logout-link {
                margin: 5px 8px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    Loading vendor profile...
</div>

<header>
    <div class="nav">
        <div class="logo">
            Primax Global, Inc.
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#government">Government</a>
            <a href="products.html">Products</a>
            <a href="index.html#about">About</a>
            <button type="button" class="btn-logout-link" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>
</header>

<main class="page">
    <div class="dashboard-card">
        <div class="dashboard-header">
            <div>
                <h1>Vendor Profile</h1>
                <div class="welcome-text" id="welcomeMessage">Welcome back</div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
        </div>

        <div class="section-title">Company Information</div>

        <form id="profileForm">
            <div class="form-grid">
                <div class="full-width">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" required placeholder="Company Name">
                </div>

                <div>
                    <label for="contactName">Contact Name</label>
                    <input type="text" id="contactName" required placeholder="Contact Person Name">
                </div>

                <div>
                    <label for="email">Account Email (ReadOnly)</label>
                    <input type="email" id="email" readonly>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 213-555-0100">
                </div>

                <div>
                    <label for="businessType">Business Type</label>
                    <select id="businessType">
                        <option value="">-- Select Business Type --</option>
                        <option value="Manufacturer">Manufacturer</option>
                        <option value="Distributor">Distributor / Wholesaler</option>
                        <option value="Service Provider">Service Provider</option>
                        <option value="Consultant">Consultant</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="full-width">
                    <label for="taxId">Tax ID / FEIN (ReadOnly)</label>
                    <input type="text" id="taxId" readonly placeholder="Federal Tax ID">
                </div>
            </div>

            <div style="margin-top: 25px;">
                <button type="submit" id="saveButton" class="btn-save">Save Profile Changes</button>
            </div>

            <div id="message" class="message"></div>
        </form>
    </div>
</main>

<footer>
    Primax Global, Inc.<br>
    3660 Wilshire Blvd, Suite 512, Los Angeles, CA 90010<br>
    © 2026 Primax Global, Inc. All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */
const SUPABASE_URL = "https://nhjapidacizvhebtpzah.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCblAx3NmcI7V8dR-_VL_w_vFmvfdhV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

/* =========================================================
   GLOBAL STATE
========================================================= */
let currentUser = null;

/* =========================================================
   DOM ELEMENTS
========================================================= */
const loadingOverlay = document.getElementById("loadingOverlay");
const profileForm = document.getElementById("profileForm");
const saveButton = document.getElementById("saveButton");
const messageBox = document.getElementById("message");
const welcomeMessage = document.getElementById("welcomeMessage");

/* =========================================================
   UI HELPERS
========================================================= */
function showMessage(text, type) {
    messageBox.className = "message " + type;
    messageBox.textContent = text;
}

/* =========================================================
   AUTH CHECK & DATA INITIALIZATION
========================================================= */
async function initDashboard() {
    try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError || !session) {
            // 로그인 세션이 없으면 로그인 페이지로 자동 이동
            window.location.href = "vendor-login.html";
            return;
        }

        currentUser = session.user;
        document.getElementById("email").value = currentUser.email || "";

        // public.vendors 테이블에서 프로필 정보 가져오기
        const { data: vendorData, error: dbError } = await supabaseClient
            .from("vendors")
            .select("*")
            .eq("user_id", currentUser.id)
            .single();

        if (dbError && dbError.code !== "PGRST116") {
            console.error("Error fetching vendor profile:", dbError);
        }

        if (vendorData) {
            document.getElementById("companyName").value = vendorData.company_name || "";
            document.getElementById("contactName").value = vendorData.contact_name || "";
            document.getElementById("phone").value = vendorData.phone || "";
            document.getElementById("businessType").value = vendorData.business_type || "";
            document.getElementById("taxId").value = vendorData.tax_id || "";

            welcomeMessage.textContent = `Welcome back, ${vendorData.company_name || currentUser.email}`;
        } else {
            welcomeMessage.textContent = `Welcome, ${currentUser.email}`;
        }

    } catch (err) {
        console.error("Dashboard initialization error:", err);
    } finally {
        loadingOverlay.style.display = "none";
    }
}

initDashboard();

/* =========================================================
   PROFILE UPDATE LOGIC
========================================================= */
profileForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    messageBox.className = "message";
    messageBox.textContent = "";

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        const companyName = document.getElementById("companyName").value.trim();
        const contactName = document.getElementById("contactName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const businessType = document.getElementById("businessType").value;

        if (!companyName || !contactName) {
            throw new Error("Company Name and Contact Name are required.");
        }

        // public.vendors 데이터 업데이트
        const { error: updateError } = await supabaseClient
            .from("vendors")
            .update({
                company_name: companyName,
                contact_name: contactName,
                phone: phone,
                business_type: businessType,
                updated_at: new Date().toISOString()
            })
            .eq("user_id", currentUser.id);

        if (updateError) throw updateError;

        welcomeMessage.textContent = `Welcome back, ${companyName}`;
        showMessage("Vendor profile updated successfully!", "success");

    } catch (error) {
        console.error("Profile save error:", error);
        showMessage(error.message || "Failed to update profile. Please try again.", "error");
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Profile Changes";
    }
});

/* =========================================================
   LOGOUT LOGIC
========================================================= */
async function handleLogout() {
    try {
        await supabaseClient.auth.signOut();
        window.location.href = "vendor-login.html";
    } catch (error) {
        console.error("Sign out error:", error);
        alert("Failed to sign out. Please try again.");
    }
}
</script>

</body>
</html>

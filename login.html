    <style>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>Miju Construction</h1>
            <p>Construction Project Administration</p>
            <span class="admin-badge">ADMIN LOGIN</span>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div class="back-links">
            <a href="miju-construction.html">
                ← Back to Miju Construction
            </a>
        </div>

        <div class="security-note">
            Authorized administrators only.<br>
            Your account must have administrator permission.
        </div>

    </div>

</div>


<script>

    /* =========================================================
       SUPABASE CONFIGURATION
       Same project used by miju-construction.html
       and admin-construction.html
       ========================================================= */

    const SUPABASE_URL =
        "https://nhjapidacizvhebtpzah.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_wCblAx3NmcI7V8dR-_VL_w_vFmvfdhV";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const messageBox =
        document.getElementById("message");

    const showPasswordButton =
        document.getElementById("showPassword");


    /* =========================================================
       MESSAGE
       ========================================================= */

    function showMessage(message, type) {

        messageBox.textContent = message;

        messageBox.className =
            "message " + type;
    }


    function clearMessage() {

        messageBox.textContent = "";

        messageBox.className =
            "message";
    }


    /* =========================================================
       SHOW / HIDE PASSWORD
       ========================================================= */

    showPasswordButton.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                showPasswordButton.textContent =
                    "Hide";

            } else {

                passwordInput.type = "password";

                showPasswordButton.textContent =
                    "Show";
            }

        }
    );


    /* =========================================================
       CHECK WHETHER USER IS ALREADY LOGGED IN
       ========================================================= */

    async function checkExistingSession() {

        try {

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();


            if (!session) {
                return;
            }


            /*
             * Check admin_users table.
             */

            const {
                data: adminUser,
                error
            } = await supabaseClient
                .from("admin_users")
                .select("user_id, role")
                .eq("user_id", session.user.id)
                .eq("role", "admin")
                .maybeSingle();


            if (error) {

                console.error(
                    "Admin check error:",
                    error
                );

                return;
            }


            if (adminUser) {

                window.location.href =
                    "admin-construction.html";
            }

        } catch (error) {

            console.error(
                "Session check error:",
                error
            );
        }
    }


    /* =========================================================
       LOGIN
       ========================================================= */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter your email and password.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Signing in...";


            try {

                /*
                 * Supabase Authentication
                 */

                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Login failed. Please check your email and password.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                if (!data || !data.user) {

                    showMessage(
                        "Login failed. No user account was returned.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                /*
                 * IMPORTANT:
                 * Authentication alone is not enough.
                 *
                 * The user must also exist in admin_users
                 * with role = admin.
                 */

                const {
                    data: adminUser,
                    error: adminError
                } = await supabaseClient
                    .from("admin_users")
                    .select("user_id, role")
                    .eq("user_id", data.user.id)
                    .eq("role", "admin")
                    .maybeSingle();


                if (adminError) {

                    console.error(
                        "Admin permission check error:",
                        adminError
                    );

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "Unable to verify administrator permission.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                if (!adminUser) {

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "This account is not authorized as a Miju Construction administrator.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                /*
                 * Successful administrator login
                 */

                showMessage(
                    "Login successful. Opening Construction Administration...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "admin-construction.html";

                    },
                    500
                );

            } catch (error) {

                console.error(
                    "Unexpected login error:",
                    error
                );

                showMessage(
                    "An unexpected error occurred. Please try again.",
                    "error"
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";
            }

        }
    );


    /* =========================================================
       ENTER KEY SUPPORT
       ========================================================= */

    passwordInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                loginForm.requestSubmit();
            }
        }
    );


    /* =========================================================
       START
       ========================================================= */

    checkExistingSession();

</script>

</body>
</html>
